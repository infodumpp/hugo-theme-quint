{{ define "main" }}
<div class="tags-gallery-container">
  <h1>{{ .Title }}</h1>

  <div class="tags-gallery">
    {{ range .Data.Terms.Alphabetical }}
      <a href="{{ .Page.RelPermalink }}" class="tag-card">
        <h2>{{ .LinkTitle }}</h2>
        <p>{{ .Count }} post{{ if ne .Count 1 }}s{{ end }}</p>
      </a>
    {{ end }}
  </div>
</div>
{{ end }}
